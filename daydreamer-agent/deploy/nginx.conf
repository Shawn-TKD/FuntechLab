limit_req_zone $binary_remote_addr zone=daydreamer_login:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=daydreamer_connections:1m;
server {
    listen 80;
    server_name your-server.example.com;
    location /.well-known/acme-challenge/ { root /var/www/daydreamer-acme; }
    location / { return 301 https://your-server.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name your-server.example.com;
    ssl_certificate /etc/letsencrypt/live/your-server.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-server.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 250m;
    client_body_timeout 120s;
    limit_conn daydreamer_connections 12;
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /api/session {
        limit_req zone=daydreamer_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
